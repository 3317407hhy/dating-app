<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>EchoZshsamber · 消息</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#000000;--bg-secondary:#16181c;--bg-card:#16181c;--bg-hover:#1d1f23;--bg-elevated:#1d1f23;--bg-input:#202327;--border:#2f3336;--text:#e7e9ea;--text-secondary:#71767b;--accent:#1d9bf0;--accent-hover:#1a8cd8;--purple:#8b5cf6;--pink:#f91880;--green:#00ba7c;--red:#f4212e;--radius:9999px;--radius-md:16px;--radius-sm:12px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.app{display:flex;width:100%;max-width:1265px;min-height:100vh}
.sidebar{width:275px;padding:0 12px;display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.side-logo{padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:9999px;width:fit-content;transition:background .2s}
.side-logo:hover{background:var(--bg-hover)}
.nav-list{list-style:none;flex:1;margin-top:4px}
.nav-item{display:flex;align-items:center;gap:16px;padding:12px;border-radius:9999px;cursor:pointer;transition:background .2s;color:var(--text);font-size:19px;font-weight:400;text-decoration:none}
.nav-item:hover{background:var(--bg-hover)}
.nav-item.active{font-weight:700}
.nav-item .ni{font-size:26px;width:28px;text-align:center;line-height:1}
.msg-badge{min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;margin-left:auto;flex-shrink:0}
.post-btn{background:var(--accent);color:#fff;border:none;border-radius:9999px;padding:15px 0;font-size:17px;font-weight:700;cursor:pointer;width:90%;margin:8px 0 16px;transition:background .2s;font-family:inherit}
.post-btn:hover{background:var(--accent-hover)}
.user-menu{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9999px;cursor:pointer;margin-bottom:8px;transition:background .2s}
.user-menu:hover{background:var(--bg-hover)}
.u-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;flex-shrink:0}
.u-info{flex:1;min-width:0}
.u-name{font-weight:700;font-size:15px}
.u-handle{color:var(--text-secondary);font-size:14px}
.main{flex:1;max-width:600px;border-left:1px solid var(--border);border-right:1px solid var(--border);min-height:100vh;display:flex;flex-direction:column}
.main-header{padding:14px 16px;border-bottom:1px solid var(--border);font-size:20px;font-weight:700;position:sticky;top:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);z-index:10;display:flex;align-items:center;gap:12px}
.msg-sim-btn{margin-left:auto;background:var(--bg-input);border:1px solid var(--border);color:var(--accent);font-size:12px;font-weight:600;padding:6px 12px;border-radius:9999px;cursor:pointer;transition:all .2s;font-family:inherit}
.msg-sim-btn:hover{background:rgba(29,155,240,.1);border-color:var(--accent)}
.login-gate{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 30px;text-align:center;min-height:300px;border-bottom:1px solid var(--border)}
.login-gate h2{font-size:28px;font-weight:700;margin-bottom:8px}
.login-gate p{font-size:15px;color:var(--text-secondary);margin-bottom:24px;line-height:1.5}
.login-gate .lg-btn{padding:12px 32px;border-radius:9999px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .2s}
.login-gate .lg-btn:hover{background:var(--accent-hover)}
.login-gate .lg-btn.outline{background:transparent;border:1px solid var(--accent);color:var(--accent);margin-top:12px}
.login-gate .lg-btn.outline:hover{background:rgba(29,155,240,.1)}
.conv-list{flex:1}
.conv-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .2s}
.conv-item:hover{background:var(--bg-hover)}
.conv-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.conv-info{flex:1;min-width:0}
.conv-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.conv-name{font-weight:700;font-size:15px}
.conv-time{font-size:11px;color:var(--text-secondary);flex-shrink:0}
.conv-preview{font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.conv-badge{min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0}
.conv-empty{text-align:center;padding:60px 16px;color:var(--text-secondary);font-size:15px}
.conv-empty .ce-icon{font-size:44px;margin-bottom:12px}
.chat-view{flex:1;display:flex;flex-direction:column;height:calc(100vh - 52px)}
.chat-header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border)}
.chat-header .back-btn{background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:50%;transition:background .2s;font-family:inherit}
.chat-header .back-btn:hover{background:var(--bg-hover)}
.ch-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.ch-info{flex:1;min-width:0}
.ch-name{font-weight:700;font-size:16px}
.ch-handle{font-size:12px;color:var(--text-secondary)}
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.bubble-row{display:flex;align-items:flex-end;gap:8px;max-width:85%}
.bubble-row.me{align-self:flex-end;flex-direction:row-reverse}
.b-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.bubble{background:var(--bg-elevated);padding:10px 14px;border-radius:18px;border-bottom-left-radius:4px;font-size:14px;line-height:1.5;word-break:break-word}
.bubble-row.me .bubble{background:var(--accent);color:#fff;border-bottom-left-radius:18px;border-bottom-right-radius:4px}
.b-time{font-size:10px;color:var(--text-secondary);margin-top:4px;text-align:right}
.bubble-row.me .b-time{color:rgba(255,255,255,.7)}
.chat-input{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--border)}
.chat-input input{flex:1;background:var(--bg-input);border:1px solid var(--border);border-radius:9999px;padding:11px 18px;font-size:14px;color:var(--text);outline:none;font-family:inherit}
.chat-input input:focus{border-color:var(--accent)}
.chat-input input::placeholder{color:var(--text-secondary)}
.send-btn{background:var(--accent);color:#fff;border:none;border-radius:9999px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;transition:background .2s;font-family:inherit}
.send-btn:hover{background:var(--accent-hover)}
.right-side{width:350px;padding:0 16px;display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.panel-card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:16px;overflow:hidden}
.panel-title{font-size:20px;font-weight:800;padding:12px 16px}
.panel-body{font-size:13px;color:var(--text-secondary);line-height:1.8;padding:0 16px 16px}
.footer-links{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;color:var(--text-secondary);font-size:13px}
.footer-links span{cursor:pointer}
.footer-links span:hover{text-decoration:underline}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%)translateY(80px);padding:10px 24px;border-radius:9999px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:1999;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)translateY(0)}
.toast.error{background:var(--red)}
</style>

<script>
var MSG_KEY="zx_messages";
var userData=JSON.parse(localStorage.getItem("zx_user")||"{}");
var currentConvId=null;
var inboxPool=[
{id:"sakura",msgs:["今晚八点一起看动画回放呀～","我也养猫，你最近有看什么新番吗？","你主页那句“二次元社恐”太真实了哈哈"]},
{id:"jie",msgs:["刚打完周本，掉落不错！下次一起？","你抽到新角色了吗？","周末有空联机吗？"]},
{id:"momo",msgs:["我新画了一张插画，想听听你的意见！","你的作品真的很有氛围感","要不要一起打卡画画？"]},
{id:"xye",msgs:["我也超喜欢《孤独摇滚》！","今天也在单曲循环乐队的歌","INFP抱团取暖哈哈"]},
{id:"xingye",name:"星野",handle:"@hoshi_23",mbti:"INFJ",avatar:"linear-gradient(135deg,#a78bfa,#7c3aed)",msgs:["你好呀，看了你的主页觉得你很温柔～","我们喜欢的番好像差不多，好巧！"]},
{id:"taozi",name:"桃子",handle:"@momoko",mbti:"ENFJ",avatar:"linear-gradient(135deg,#fda4af,#fb7185)",msgs:["嗨！你也是画画爱好者吗？","周末有个二次元聚会，要来吗？"]}
];
function getConversations(){var v=localStorage.getItem(MSG_KEY);if(!v)return null;try{return JSON.parse(v)}catch(e){return null}}
function saveConversations(c){localStorage.setItem(MSG_KEY,JSON.stringify(c))}
function showToast(m,t){var e=document.getElementById("toast");if(!e)return;e.textContent=m;e.className="toast"+(t==="error"?" error":"");e.classList.add("show");clearTimeout(e._timer);e._timer=setTimeout(function(){e.classList.remove("show")},2800)}
function seedMessages(){
var now=Date.now(),h=3600000;
saveConversations([
{id:"sakura",name:"小樱",handle:"@sakura_chan",mbti:"ENFP",avatar:"linear-gradient(135deg,#f472b6,#ec4899)",unread:2,messages:[
{from:"other",text:"你好呀！看到你也喜欢《孤独摇滚》，我超喜欢喜多！",time:now-26*h},
{from:"me",text:"哈哈是的！我最喜欢波奇酱，太真实了",time:now-25*h},
{from:"other",text:"今晚八点有动画回放，要不要一起看？",time:now-10*60000},
{from:"other",text:"顺便说一句，你头像好可爱～",time:now-5*60000}
]},
{id:"jie",name:"阿杰",handle:"@jie_otaku",mbti:"INTJ",avatar:"linear-gradient(135deg,#818cf8,#6366f1)",unread:1,messages:[
{from:"other",text:"你好，看到你在找游戏搭子，我也在玩原神",time:now-20*h},
{from:"me",text:"好呀！你冒险等级多少了？",time:now-19*h},
{from:"other",text:"55级了，周末可以一起打周本",time:now-20*60000}
]},
{id:"momo",name:"Momo",handle:"@momo_paint",mbti:"INFP",avatar:"linear-gradient(135deg,#fbbf24,#f59e0b)",unread:1,messages:[
{from:"other",text:"你好！看到你也喜欢画画，可以互相看看作品吗？",time:now-8*h},
{from:"other",text:"我最近在画一组星空主题的插画",time:now-15*60000}
]},
{id:"xye",name:"小夜",handle:"@night_yy",mbti:"INFP",avatar:"linear-gradient(135deg,#34d399,#10b981)",unread:1,messages:[
{from:"other",text:"我也是INFP！握手🤝 你平时听什么歌？",time:now-30*60000}
]}
]);
}
function updateBadges(){
var convs=getConversations()||[],n=0;
for(var i=0;i<convs.length;i++){n+=(convs[i].unread||0)}
var b=document.getElementById("navMsgBadge");
if(b){b.style.display=n>0?"flex":"none";b.textContent=n>9?"9+":n}
document.title=(n>0?"("+n+") ":"")+"EchoZshsamber · 消息";
}
function formatTime(t){
var d=new Date(t),now=new Date();
var hm=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
if(d.toDateString()===now.toDateString())return hm;
if(d.getFullYear()===now.getFullYear())return (d.getMonth()+1)+"/"+d.getDate()+" "+hm;
return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate();
}
function convItemHtml(c){
var msgs=c.messages||[],last=msgs.length?msgs[msgs.length-1]:null;
var preview=last?(last.from==="me"?"我："+last.text:last.text):"暂无消息";
var timeText=last?formatTime(last.time):"";
var badge=c.unread>0?'<span class="conv-badge">'+(c.unread>9?"9+":c.unread)+'</span>':"";
var av=c.avatar||"linear-gradient(135deg,#6366f1,#8b5cf6)";
return '<div class="conv-item" onclick="openChat(\''+c.id+'\')">'
+'<div class="conv-avatar" style="background:'+av+'">'+c.name.charAt(0)+'</div>'
+'<div class="conv-info"><div class="conv-top"><span class="conv-name">'+c.name+'</span><span class="conv-time">'+timeText+'</span></div>'
+'<div class="conv-preview">'+preview+'</div></div>'+badge+'</div>';
}
function renderConvList(){
var convs=getConversations()||[];
var list=document.getElementById("convList");
if(!convs.length){list.innerHTML='<div class="conv-empty"><div class="ce-icon">💌</div><div>还没有收到消息</div><div style="font-size:13px;margin-top:8px">点击右上角「📨 模拟接收」体验收到新消息</div></div>';updateBadges();return}
convs.sort(function(a,b){
var am=a.messages&&a.messages.length?a.messages[a.messages.length-1].time:0;
var bm=b.messages&&b.messages.length?b.messages[b.messages.length-1].time:0;
return bm-am;
});
list.innerHTML=convs.map(convItemHtml).join("");
updateBadges();
}
function openChat(id){
var convs=getConversations();if(!convs)return;
var c=null;for(var i=0;i<convs.length;i++){if(convs[i].id===id){c=convs[i];break}}
if(!c)return;
currentConvId=id;c.unread=0;saveConversations(convs);
document.getElementById("convList").style.display="none";
document.getElementById("chatView").style.display="flex";
document.getElementById("chatName").textContent=c.name;
document.getElementById("chatHandle").textContent=(c.handle||"@user")+" · "+(c.mbti||"");
var ca=document.getElementById("chatAvatar");
ca.textContent=c.name.charAt(0);ca.style.background=c.avatar||"linear-gradient(135deg,#6366f1,#8b5cf6)";
renderChat(c);updateBadges();
}
function closeChat(){
currentConvId=null;
document.getElementById("chatView").style.display="none";
document.getElementById("convList").style.display="block";
renderConvList();
}
function renderChat(c){
var body=document.getElementById("chatBody");
var msgs=c.messages||[];
if(!msgs.length){body.innerHTML='<div class="conv-empty" style="margin:auto"><div class="ce-icon">👋</div><div>你们还没聊过天，先打个招呼吧</div></div>';return}
var av=c.avatar||"linear-gradient(135deg,#6366f1,#8b5cf6)";
body.innerHTML=msgs.map(function(m){
var me=m.from==="me";
return '<div class="bubble-row '+(me?"me":"other")+'">'
+(me?"":'<div class="b-avatar" style="background:'+av+'">'+c.name.charAt(0)+'</div>')
+'<div class="bubble">'+m.text+'<div class="b-time">'+formatTime(m.time)+'</div></div></div>';
}).join("");
body.scrollTop=body.scrollHeight;
}
function sendMsg(){
if(!currentConvId)return;
var inp=document.getElementById("chatInput"),v=inp.value.trim();
if(!v){showToast("请输入消息内容","error");return}
var convs=getConversations();if(!convs)return;
var c=null;for(var i=0;i<convs.length;i++){if(convs[i].id===currentConvId){c=convs[i];break}}
if(!c)return;
c.messages.push({from:"me",text:v,time:Date.now()});
saveConversations(convs);inp.value="";renderChat(c);
}
function simulateIncoming(){
var convs=getConversations();if(!convs)return;
var pick=inboxPool[Math.floor(Math.random()*inboxPool.length)];
var text=pick.msgs[Math.floor(Math.random()*pick.msgs.length)];
var conv=null;for(var i=0;i<convs.length;i++){if(convs[i].id===pick.id){conv=convs[i];break}}
if(!conv){conv={id:pick.id,name:pick.name,handle:pick.handle,mbti:pick.mbti,avatar:pick.avatar,unread:0,messages:[]};convs.push(conv)}
conv.messages.push({from:"other",text:text,time:Date.now()});
if(currentConvId===conv.id){
saveConversations(convs);renderChat(conv);updateBadges();
}else{
conv.unread=(conv.unread||0)+1;
saveConversations(convs);
if(currentConvId===null){renderConvList()}
updateBadges();
}
showToast("📨 "+conv.name+" 给你发了一条新消息");
}
function init(){
var av=document.getElementById("uAvatar"),nm=document.getElementById("uName"),hd=document.getElementById("uHandle");
var isLoggedIn=!!(userData.name&&userData.email);
if(isLoggedIn){
nm.textContent=userData.name;av.textContent=userData.avatarChar||userData.name.charAt(0);
if(userData.handle)hd.textContent=userData.handle;
document.getElementById("userMenuBottom").style.display="flex";
document.getElementById("userMenuBottom").onclick=function(){window.location.href="个人主页.html"};
document.getElementById("loginGate").style.display="none";
if(!localStorage.getItem(MSG_KEY))seedMessages();
renderConvList();
if(!localStorage.getItem("zx_msg_auto")){
localStorage.setItem("zx_msg_auto","1");
setTimeout(simulateIncoming,4000);
}
}else{
nm.textContent="未登录";hd.textContent="点击登录";av.textContent="?";
document.getElementById("userMenuBottom").style.display="flex";
document.getElementById("userMenuBottom").onclick=function(){window.location.href="注册登录.html"};
document.getElementById("loginGate").style.display="flex";
document.getElementById("convList").style.display="none";
document.getElementById("simBtn").style.display="none";
}
updateBadges();
}
document.getElementById("chatInput").addEventListener("keydown",function(e){if(e.key==="Enter"){sendMsg()}});
init();
</script>
</body></html>
